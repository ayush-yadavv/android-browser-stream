services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: android-browser-stream-backend
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../backend/bin:/app/bin
      - backend-data:/app/data
    environment:
      - SERVER_PORT=8080
      - REDROID_IMAGE=redroid/redroid:13.0.0-latest
      - ADB_PORT_START=5555
      - MAX_SESSIONS=3
      - SCRCPY_BIN_PATH=/app/bin/scrcpy-server
      - DB_PATH=/app/data/sessions.db

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: android-browser-stream-frontend
    restart: unless-stopped
    network_mode: host
    depends_on:
      - backend

volumes:
  backend-data:
